name: Playback Chain Guard

# 播放链路专用门禁（blocking），与 test-suite.yml 的全量非阻塞观察流水线解耦。
# 钉死 2026-09-09 拍板的播放链路契约，防止被改坏：
#   1. 直投 DLNA 投前预检：判无源（probe false / 换 token 409）→ 按播放模式跳下一首，
#      绝不把死链扔给设备干等（dlna_chain_guard_test.dart 五分支）；
#   2. 直投自动续播语义：order/all/shuffle/one 各模式推进与不跨曲（dlna_auto_next_sim_test.dart）；
#   3. 直投 provider 接线（dlna_provider_test.dart）；
#   4. 「无死歌名单 + 无停播阈值」决策：本机与直投均无限跳，坏歌每首都真试
#      （服务端换源治愈后自动复活）。静态扫描拦截 deadSongs/失败连击上限回归。
# 服务端侧由 MusicFlow 仓库 .github/workflows/playback-chain-guard.yml 对称覆盖。

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dlna-chain-guard:
    name: dlna chain guard (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run DLNA chain guard tests
        run: |
          flutter test test/core/dlna/dlna_chain_guard_test.dart
          flutter test test/core/dlna/dlna_auto_next_sim_test.dart
          flutter test test/providers/dlna_provider_test.dart

      - name: Run local playback chain guard tests
        run: flutter test test/core/player/playback_error_guard_test.dart

      # 跨仓契约(客户端侧):客户端靠服务端 409 判定「无可用音源」,服务端哪天把
      # 409 改成 404/400,两仓测试各自仍绿、线上直接失效。这里钉死客户端的
      # 409 → DlnaSongUnplayableException 映射;服务端对称断言见 MusicFlow 仓库
      # 同名 workflow 的 "409 no-playable-source contract" 步骤。
      - name: "Guard - 409 to DlnaSongUnplayableException contract (cross-repo)"
        shell: bash
        run: |
          miss=0
          if ! grep -A 3 "statusCode == 409" lib/data/sources/subsonic_api_client.dart | grep -q "DlnaSongUnplayableException"; then
            echo "::error::跨仓契约回归:getDlnaCastStreamUrl 必须把服务端 409 映射为 DlnaSongUnplayableException"
            miss=1
          fi
          if ! grep -rq "class DlnaSongUnplayableException\|DlnaSongUnplayableException(" lib/core/dlna/; then
            echo "::error::跨仓契约回归:lib/core/dlna 缺少 DlnaSongUnplayableException"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 409 映射契约在位"; fi
          exit "$miss"

      # 静态守卫：deadSongs（死歌名单）与失败连击停播上限（_maxFailStreak /
      # LOCAL_MAX_FAIL_STREAK / _maxCastFailStreak）已按 2026-09-09 决策整体移除，
      # 任何形式回归（重新引入拉黑或停播阈值）直接 CI 失败。
      - name: "Guard - no dead-song blacklist / no stop threshold"
        shell: bash
        run: |
          # 只匹配「带下划线前缀的私有标识符」(真回归)，注释里提到旧机制不误伤。
          if grep -rnE "_deadSongs|_maxFailStreak|_maxCastFailStreak" lib/ ; then
            echo "::error::播放链路契约回归:不允许重新引入死歌名单或停播阈值(2026-09-09 拍板:坏歌无限跳,靠换源治愈)"
            exit 1
          fi
          echo "OK: 无死歌名单/停播阈值回归"
