name: Playback Chain Guard

# 播放链路专用门禁（blocking），与 test-suite.yml 的全量非阻塞观察流水线解耦。
# 钉死 2026-09-09 拍板的播放链路契约，防止被改坏：
#   1. 直投 DLNA 投前预检：判无源（probe false / 换 token 409）→ 按播放模式跳下一首，
#      绝不把死链扔给设备干等（dlna_chain_guard_test.dart 五分支）；
#   2. 直投自动续播语义：order/all/shuffle/one 各模式推进与不跨曲（dlna_auto_next_sim_test.dart）；
#   3. 直投 provider 接线（dlna_provider_test.dart）；
#   4. 「无死歌名单 + 无停播阈值」决策：本机与直投均无限跳，坏歌每首都真试
#      （服务端换源治愈后自动复活）。静态扫描拦截 deadSongs/失败连击上限回归。
# 服务端侧由 MusicFlow 仓库 .github/workflows/playback-chain-guard.yml 对称覆盖。

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dlna-chain-guard:
    name: dlna chain guard (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run DLNA chain guard tests
        run: |
          flutter test test/core/dlna/dlna_chain_guard_test.dart
          flutter test test/core/dlna/dlna_auto_next_sim_test.dart
          flutter test test/providers/dlna_provider_test.dart

      - name: Run local playback chain guard tests
        run: flutter test test/core/player/playback_error_guard_test.dart

      # 本机播放模式契约(阻塞):四态映射 / 旧名迁移 / 顺序模式预跳过护栏。
      # 之前只在非阻塞 test-suite 跑,回归不挡发布 —— 随机/顺序模式被破坏时
      # 只会在桌面端被真人发现。playback_mode_test 钉死 order/all/one/shuffle
      # 的语义边界与持久化旧值映射,必须阻塞发布。
      - name: Run local playback-mode contract tests
        run: flutter test test/providers/player/playback_mode_test.dart

      # 进度条点击/长按 seek 守卫(阻塞):Windows 鼠标按住 ≥ kPressTimeout 时
      # tap 竞技场判胜、drag 被淘汰会误触发取消——修复后必须锁住「鼠标长按
      # 不动再松开仍 seek」这一回归,否则发版后又退回「点击进度条弹回原处」。
      - name: Run scrubber seek (mouse press-and-hold) regression tests
        run: flutter test test/features/player/player_scrubber_test.dart

      # 接续搬移链路守卫（2026-09-10 拍板）：搬移必须主通道优先 + songId 身份
      # 定位 + 队列来源随会话持久化。这三条跨越「发起→落盘→重启恢复→搬移」
      # 四个环节，任何一环被绕开都不会让既有单测变红（已用变异验证确认：
      # 删掉恢复侧回填，全量测试仍全绿），所以必须用结构扫描兜住。
      - name: Run handoff chain guard tests
        run: |
          flutter test test/providers/cast_peer_provider_test.dart
          flutter test test/core/player/playback_payload_test.dart

      - name: "Guard - handoff main-channel-first + origin persistence"
        run: dart run tool/handoff_chain_scan.dart

      # 4 条链路「坏源 / 换源 / 全源失效」模拟（2026-09-10 用户要求）：
      # 本机源无效、WebDAV 源无效、未命中歌曲、换源、全部源失效切歌 —— 任一场景
      # 都不得让播放链路卡住。这里既跑真行为模拟（handoff_e2e_test 起本地 HTTP
      # 服务端跑完整 pushLocalToPeer），也跑结构契约扫描（source_failure_chain_test）。
      #
      # 注意：source_failure_chain_test 的「next() 必须可达」断言是变异验证逼出来的
      # —— 曾出现「方法体里 next() 仍在，但前面被 if (true) return; 短路」，字面
      # 断言全绿而用户永远卡在坏源上。
      - name: Run source-failure chain simulation tests
        run: |
          flutter test test/core/playback/source_failure_chain_test.dart
          flutter test test/providers/handoff_e2e_test.dart

      # 接续搬移**端到端**模拟：起真 HTTP 假服务端 + 真 ProviderContainer，
      # 验证主通道在真实 HTTP 语义下（含 content-type/JSON 形状）确实跑通、
      # 3251 首大歌单 body 仍只有几百字节、服务端按 songId 身份定位起点、
      # 404 时自动回落整队且用户无感。
      - name: "Guard - handoff end-to-end (real HTTP, large playlist)"
        run: dart run tool/handoff_e2e_scan.dart

      # 跨仓契约(客户端侧):客户端靠服务端 409 判定「无可用音源」,服务端哪天把
      # 409 改成 404/400,两仓测试各自仍绿、线上直接失效。这里钉死客户端的
      # 409 → DlnaSongUnplayableException 映射;服务端对称断言见 MusicFlow 仓库
      # 同名 workflow 的 "409 no-playable-source contract" 步骤。
      - name: "Guard - 409 to DlnaSongUnplayableException contract (cross-repo)"
        shell: bash
        run: |
          miss=0
          if ! grep -A 3 "statusCode == 409" lib/data/sources/subsonic_api_client.dart | grep -q "DlnaSongUnplayableException"; then
            echo "::error::跨仓契约回归:getDlnaCastStreamUrl 必须把服务端 409 映射为 DlnaSongUnplayableException"
            miss=1
          fi
          if ! grep -rq "class DlnaSongUnplayableException\|DlnaSongUnplayableException(" lib/core/dlna/; then
            echo "::error::跨仓契约回归:lib/core/dlna 缺少 DlnaSongUnplayableException"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 409 映射契约在位"; fi
          exit "$miss"

      # 静态守卫：deadSongs（死歌名单）与失败连击停播上限（_maxFailStreak /
      # LOCAL_MAX_FAIL_STREAK / _maxCastFailStreak）已按 2026-09-09 决策整体移除，
      # 任何形式回归（重新引入拉黑或停播阈值）直接 CI 失败。
      - name: "Guard - no dead-song blacklist / no stop threshold"
        shell: bash
        run: |
          # 只匹配「带下划线前缀的私有标识符」(真回归)，注释里提到旧机制不误伤。
          if grep -rnE "_deadSongs|_maxFailStreak|_maxCastFailStreak" lib/ ; then
            echo "::error::播放链路契约回归:不允许重新引入死歌名单或停播阈值(2026-09-09 拍板:坏歌无限跳,靠换源治愈)"
            exit 1
          fi
          echo "OK: 无死歌名单/停播阈值回归"
