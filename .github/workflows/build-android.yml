name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run dart analyze
        run: dart analyze lib/
        continue-on-error: true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK for release
        run: cp build/app/outputs/flutter-apk/app-release.apk "MusicFlowClient-${{ github.run_number }}.apk"

      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y || true
          git push --delete origin latest || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MusicFlow Client (最新构建 #${{ github.run_number }})"
          body: |
            自动构建的 release 版本 APK。
            提交: ${{ github.sha }}
            工作流运行: #${{ github.run_number }}
          files: "MusicFlowClient-${{ github.run_number }}.apk"
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: musicflow-client-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
