name: Build Client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check interaction feedback compliance
        run: dart run tool/check_interaction_feedback.dart

      - name: Run dart analyze
        run: dart analyze lib/
        continue-on-error: true

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/android/app/release-key.jks"

      - name: Build APK (Release)
        env:
          ECHO_STORE_FILE: ${{ github.workspace }}/android/app/release-key.jks
          ECHO_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # --target-platform android-arm64 + --split-per-abi:只打包 arm64-v8a(ARMv8 及以上)。
        # --target-platform 只过滤 Flutter 自身产物(libapp.so/libflutter.so),
        # 第三方 Maven AAR 原生库(如 libsqlite3.so)仍会带全 ABI;
        # 配合 --split-per-abi 后每个 APK 只含 arm64 一种 ABI,彻底过滤其他架构。
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Rename APK for release
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "MusicFlow-${{ github.run_number }}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicflow-android
          path: MusicFlow-${{ github.run_number }}-android.apk
          retention-days: 30

  build-windows:
    name: Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check interaction feedback compliance
        run: dart run tool/check_interaction_feedback.dart

      - name: Run dart analyze
        run: dart analyze lib/
        continue-on-error: true

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Package portable zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MusicFlow-${{ github.run_number }}-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicflow-windows
          path: MusicFlow-${{ github.run_number }}-windows.zip
          retention-days: 30

  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/heads/main')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      # checkout 必须先于 download：actions/checkout 会重置工作目录，
      # 若在 download 之后执行会把刚下载的 apk/zip 清掉，导致 Release 无资产。
      - name: Checkout code (for git push)
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: musicflow-android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: musicflow-windows

      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y || true
          git push --delete origin latest || true

      # prerelease: 滚动构建不抢占 releases/latest(prerelease 不能被设为 latest)。
      # 这样客户端 UpdateChecker 追踪的 releases/latest 只会命中正式的版本化 Release。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MusicFlow Client (最新构建 #${{ github.run_number }})"
          body: |
            自动构建的滚动发布(预发布)。
            提交: ${{ github.sha }}
            工作流运行: #${{ github.run_number }}

            - **Android**: `MusicFlow-${{ github.run_number }}-android.apk`
            - **Windows**: `MusicFlow-${{ github.run_number }}-windows.zip` (解压即用)
          files: |
            MusicFlow-${{ github.run_number }}-android.apk
            MusicFlow-${{ github.run_number }}-windows.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-versioned:
    name: Publish Versioned Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0: 需要完整 git 历史来生成变更日志。
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: musicflow-android
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: musicflow-windows
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash tool/generate_release_notes.sh "$TAG" -o changelog_body.md
          cat >> changelog_body.md <<'EOF'

          ### 构建信息
          提交: ${{ github.sha }}

          - **Android**: `MusicFlow-${{ github.run_number }}-android.apk`
          - **Windows**: `MusicFlow-${{ github.run_number }}-windows.zip` (解压即用)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MusicFlow Client ${{ steps.version.outputs.tag }}"
          body_path: changelog_body.md
          files: |
            artifacts/MusicFlow-${{ github.run_number }}-android.apk
            artifacts/MusicFlow-${{ github.run_number }}-windows.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
