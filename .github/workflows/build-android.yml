name: Build Client

# 只保留一套发版体系：仅版本 tag (vX.Y.Z) 触发构建与发布。
# 不再监听 main 推送(滚动构建/预发布 leak)也无需手动 dispatch，
# 强制所有发布都走 tag，避免维护两套发版逻辑。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 发版规则统一为「只打 tag」：正式版本号只以 tag(如 v3.3.0) 为准，
  # 不再依赖每次改动 pubspec.yaml 版本号。此 job 把解析出的版本号注入后续
  # 所有构建产物(安卓 versionName / Windows 文件版本)，从而保证应用内
  # 「检查更新」显示的当前版本号与本次发布版本绝对一致。
  resolve-version:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
      artifact_tag: ${{ steps.v.outputs.artifact_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          # 纯 tag 体系：版本号只以 tag(如 v3.3.0) 为准，强制作业必须由版本 tag 触发。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            echo "::error::发版必须通过版本 tag (vX.Y.Z) 触发，已拒绝非 tag 构建。"
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          # 产物文件名用的紧凑 tag(去点):v3.3.0 → v330, 如 MusicFlow-v330-android.apk
          echo "artifact_tag=v${ver//./}" >> "$GITHUB_OUTPUT"
          # 用每次运行自增的序号作为内部 buildNumber(安卓 versionCode)，
          # 保证新构建的版本号一定大于旧版本。
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  test-dlna:
    name: DLNA Feature Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          # 禁用缓存构建：每次 tag 发布都全新编译，避免缓存命中旧产物
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Run dart analyze (lib)
        run: dart analyze lib/
        continue-on-error: true

      # 链路 B（局域网 DLNA 直投）的专属测试 + 其依赖的共用 Toast（此前有布局 bug，
      # 已在 music_flow_message.dart 修复）用完整 `flutter test` 校验。仓库仍有其他
      # 与本次无关的历史失败用例（CI 过往从未跑测试），故这里先聚焦本特性。
      # device_description_test.dart 回归「能发现设备但投屏失败」的控制 URL 解析错误。
      # 三条投屏/保活链路回归：
      #   · 链路 A（切换播放器）：test/providers/cast_peer_provider_test.dart
      #   · 链路 B（局域网 DLNA 直投）：test/providers/dlna_provider_test.dart
      #     + test/core/dlna/dlna_auto_next_sim_test.dart（曲末看门狗续播）
      #   · 客户端保活：test/core/dlna/dlna_keepalive_test.dart（引用计数）
      #     + test/core/services/audio_handler_service_test.dart（本机音频前台媒体会话）
      #   · 首页布局回归（标题↔刷新按钮 15px、播放按钮距屏幕右边缘 15px，
      #     含「trailing 直接放 Expanded 会被拉宽居中」的回归保护）：
      #     test/features/discover/discover_page_test.dart
      - name: Run DLNA feature tests
        run: >-
          flutter test
          test/core/dlna/dlna_models_test.dart
          test/core/dlna/device_description_test.dart
          test/core/dlna/dlna_keepalive_test.dart
          test/core/dlna/dlna_auto_next_sim_test.dart
          test/features/player/local_dlna_cast_sheet_test.dart
          test/core/utils/toast_notifier_test.dart
          test/core/services/audio_handler_service_test.dart
          test/providers/cast_peer_provider_test.dart
          test/providers/dlna_provider_test.dart
          test/features/discover/discover_page_test.dart

  build-android:
    name: Android APK
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          # 禁用缓存构建：每次 tag 发布都全新编译，避免缓存命中旧产物
          cache: false

      - name: Clean previous build
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Check interaction feedback compliance
        run: dart run tool/check_interaction_feedback.dart

      - name: Run dart analyze
        run: dart analyze lib/
        continue-on-error: true

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/android/app/release-key.jks"

      - name: Build APK (Release)
        env:
          ECHO_STORE_FILE: ${{ github.workspace }}/android/app/release-key.jks
          ECHO_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # --target-platform android-arm64 + --split-per-abi:只打包 arm64-v8a(ARMv8 及以上)。
        # --target-platform 只过滤 Flutter 自身产物(libapp.so/libflutter.so),
        # 第三方 Maven AAR 原生库(如 libsqlite3.so)仍会带全 ABI;
        # 配合 --split-per-abi 后每个 APK 只含 arm64 一种 ABI,彻底过滤其他架构。
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-name="${{ needs.resolve-version.outputs.version }}" --build-number=${{ needs.resolve-version.outputs.build_number }}

      - name: Rename APK for release
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicflow-android
          path: MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-android.apk
          retention-days: 30

  build-windows:
    name: Windows Portable
    needs: [resolve-version]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          # 禁用缓存构建：每次 tag 发布都全新编译，避免缓存命中旧产物
          cache: false

      - name: Clean previous build
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Check interaction feedback compliance
        run: dart run tool/check_interaction_feedback.dart

      - name: Run dart analyze
        run: dart analyze lib/
        continue-on-error: true

      - name: Build Windows (Release)
        run: flutter build windows --release --build-name="${{ needs.resolve-version.outputs.version }}" --build-number=${{ needs.resolve-version.outputs.build_number }}

      - name: Package portable zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-windows.zip"

      # 安装包版本(单文件):windows-latest 预装 Inno Setup 6。
      # 安装向导支持勾选「开始菜单快捷方式 / 桌面快捷方式」(见 windows/installer.iss Tasks)。
      - name: Build installer (Inno Setup single-file)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer.iss" /DAppVersion="${{ needs.resolve-version.outputs.version }}" /DArtifactTag="${{ needs.resolve-version.outputs.artifact_tag }}" /O"${{ github.workspace }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicflow-windows
          path: |
            MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-windows.zip
            MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-windows-setup.exe
          retention-days: 30

  publish-versioned:
    name: Publish Versioned Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [resolve-version, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0: 需要完整 git 历史来生成变更日志。
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: musicflow-android
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: musicflow-windows
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash tool/generate_release_notes.sh "$TAG" -o changelog_body.md
          cat >> changelog_body.md <<'EOF'

          ### 构建信息
          提交: ${{ github.sha }}

          - **Android**: `MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-android.apk`
          - **Windows**: `MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-windows.zip` (绿色版,解压即用) / `MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-windows-setup.exe` (安装版,安装时可勾选开始菜单/桌面快捷方式)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MusicFlow Client ${{ steps.version.outputs.tag }}"
          body_path: changelog_body.md
          files: |
            artifacts/MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-android.apk
            artifacts/MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-windows.zip
            artifacts/MusicFlow-${{ needs.resolve-version.outputs.artifact_tag }}-windows-setup.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
