name: Gitee connectivity probe

# 临时只读探测 workflow（结束后删除）：定位 runner → Gitee 的真实故障层。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Gitee git receive-pack discovery (unauthenticated)
        run: |
          timeout 30 curl -sS -o /dev/null -w 'RECV_HTTP=%{http_code} time=%{time_total}\n' 'https://gitee.com/ray5378/music-flow-client.git/info/refs?service=git-receive-pack' || echo "RECV_FAIL_OR_TIMEOUT"

      - name: Gitee authenticated receive-pack discovery via Basic auth
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "token_present=$([ -n "${GITEE_TOKEN}" ] && echo yes || echo no)"
          timeout 30 curl -sS -o /tmp/recv.out -w 'AUTH_RECV_HTTP=%{http_code} time=%{time_total}\n' --user "ray5378:${GITEE_TOKEN}" 'https://gitee.com/ray5378/music-flow-client.git/info/refs?service=git-receive-pack' || echo "AUTH_RECV_FAIL_OR_TIMEOUT"
          head -c 120 /tmp/recv.out 2>/dev/null || true
          echo

      - name: Gitee authenticated API v5 GET /user
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          timeout 30 curl -sS -o /tmp/user.out -w 'AUTH_API_HTTP=%{http_code} time=%{time_total}\n' "https://gitee.com/api/v5/user?access_token=${GITEE_TOKEN}" || echo "AUTH_API_FAIL_OR_TIMEOUT"
          python3 -c "import json; d=json.load(open('/tmp/user.out')); print('login=',d.get('login'))" 2>/dev/null || true

      - name: git ls-remote over HTTPS (unauthenticated)
        run: |
          timeout 30 git ls-remote https://gitee.com/ray5378/music-flow-client.git HEAD 2>&1 | head -5 || echo "LSREMOTE_FAIL_OR_TIMEOUT"

      - name: git push --dry-run with credential helper (no ref change)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -u
          tmp="$(mktemp -d)"
          cd "${tmp}"
          git init -q -b main
          git config user.email probe@example.invalid
          git config user.name probe
          echo probe > probe.txt
          git add probe.txt
          git commit -qm probe
          helper="${tmp}/cred.sh"
          cat > "${helper}" <<'HELPER'
          #!/usr/bin/env bash
          printf 'username=ray5378\npassword=%s\n' "${GITEE_TOKEN}"
          HELPER
          chmod 700 "${helper}"
          git config --global "credential.https://gitee.com.helper" "!${helper}"
          git remote add gitee https://gitee.com/ray5378/music-flow-client.git
          set +e
          timeout 60 git push --dry-run gitee main 2>&1 | head -30
          rc=${PIPESTATUS[0]}
          set -e
          echo "DRYRUN_EXIT=${rc}"
          git config --global --unset-all "credential.https://gitee.com.helper" || true
