name: Gitee connectivity probe

# 临时探测 workflow（结束后删除）：测量 runner 推送完整仓库到 Gitee 的真实耗时。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Time a full-repo push to throwaway branch
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -u
          helper="${RUNNER_TEMP}/cred.sh"
          cat > "${helper}" <<'HELPER'
          #!/usr/bin/env bash
          printf 'username=ray5378\npassword=%s\n' "${GITEE_TOKEN}"
          HELPER
          chmod 700 "${helper}"
          git config --global "credential.https://gitee.com.helper" "!${helper}"
          git remote add gitee https://gitee.com/ray5378/music-flow-client.git
          start=$(date +%s)
          set +e
          timeout 600 git push gitee "refs/remotes/origin/main:refs/heads/probe-full-push" 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          set -e
          end=$(date +%s)
          echo "FULLPUSH_EXIT=${rc} ELAPSED=$((end-start))s"
          set +e
          timeout 90 git push gitee --delete refs/heads/probe-full-push 2>&1 | tail -5
          echo "DELETE_EXIT=${PIPESTATUS[0]}"
          set -e
          git config --global --unset-all "credential.https://gitee.com.helper" || true
