name: Gitee connectivity probe

# 临时探测 workflow（结束后删除）：验证 runner 真实 push pack 数据是否被 Gitee 卡住。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Real tiny push to throwaway branch, then delete it
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -u
          tmp="$(mktemp -d)"
          cd "${tmp}"
          git init -q -b main
          git config user.email probe@example.invalid
          git config user.name probe
          echo probe > probe.txt
          git commit -qam probe
          helper="${tmp}/cred.sh"
          cat > "${helper}" <<'HELPER'
          #!/usr/bin/env bash
          printf 'username=ray5378\npassword=%s\n' "${GITEE_TOKEN}"
          HELPER
          chmod 700 "${helper}"
          git config --global "credential.https://gitee.com.helper" "!${helper}"
          git remote add gitee https://gitee.com/ray5378/music-flow-client.git
          set +e
          timeout 90 git push gitee "HEAD:refs/heads/probe-gitee-connectivity" 2>&1 | head -40
          rc=${PIPESTATUS[0]}
          set -e
          echo "REALPUSH_EXIT=${rc}"
          echo "--- cleanup ---"
          timeout 30 curl -sS -o /dev/null -w 'DELETE_REF_HTTP=%{http_code}\n' -X DELETE "https://gitee.com/api/v5/repos/ray5378/music-flow-client/git/refs/heads/probe-gitee-connectivity?access_token=${GITEE_TOKEN}" || echo DELETE_FAIL
          git config --global --unset-all "credential.https://gitee.com.helper" || true
