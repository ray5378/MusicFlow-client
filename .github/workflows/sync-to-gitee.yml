name: Sync Release to Gitee

# GitHub Release 发布成功后，把「源码 + tag 镜像」与「Release 全部产物」单向同步到
# https://gitee.com/ray5378/music-flow-client
#
# 边界：
#   - 版本号唯一来源仍是 git tag；本 workflow 不改 pubspec.yaml / CHANGELOG / 业务代码。
#   - Gitee 是下游镜像，GitHub 是唯一真源；Gitee 默认分支由本 workflow 幂等设为 main。
# 触发：
#   - workflow_run（Build Client completed）：CI 用 GITHUB_TOKEN 创建的 Release 不会
#     触发 release 事件（GitHub 官方递归限制），workflow_run 不受此限制 —— 发版
#     workflow 跑完即自动同步。tag push 时 head_branch 就是 tag 名（如 v5.17.0），
#     仅放行 conclusion=success 且 head_branch 形如 vX.Y.Z 的 run；
#   - release published：人工发布/补发 Release 时自动同步；
#   - workflow_dispatch：手动重放同步（用于端到端验证，不会发新版本）。
on:
  workflow_run:
    workflows: ["Build Client"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag（留空 = GitHub 最新 Release，如 v5.16.3）'
        required: false
        type: string
        default: ''

# 最小权限：读源码 + 读自身 Release 产物，GITHUB_TOKEN 的 contents: read 足够。
# Gitee 侧完全走仓库 Secret GITEE_TOKEN，与 GITHUB_TOKEN 无关。
permissions:
  contents: read

# 同一 tag 的重复触发/手动重跑串行执行，避免并发推送与重复上传。
concurrency:
  group: sync-to-gitee-${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Sync ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch || 'latest' }} to Gitee
    runs-on: ubuntu-latest
    # 三种触发复用同一个 job：
    #   - dispatch：直接放行；
    #   - release 事件：排除草稿；
    #   - workflow_run：仅放行 Build Client 成功、且 head_branch 以 v 开头且含
    #     「.」（发版 tag vX.Y.Z 形态；Build Client 只在 tag push 时跑，防御式
    #     过滤 main 分支的普通 run）。
    # 注意：if 表达式必须单行、不得混入 # 注释/URL —— GitHub 表达式没有
    # matches()（只有 contains/startsWith/endsWith 等），折叠标量里 # 也不是
    # 注释，混入任何多余文本都会 HTTP 422 解析失败。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.draft == false) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '.'))
    env:
      EVENT_TAG: ${{ github.event.release.tag_name }}
      WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      INPUT_TAG: ${{ inputs.tag }}
      GITEE_OWNER: ray5378
      GITEE_REPO: music-flow-client
      GITEE_DEFAULT_BRANCH: main
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      BODY_FILE: ${{ github.workspace }}/.gitee_release_body.md
    steps:
      - name: Checkout source (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 不把 GITHUB_TOKEN 持久化进 .git/config；Gitee 认证用下面的临时 credential helper。
          persist-credentials: false

      # 单一入口解析 tag 与 Release 元数据，workflow_run / release / dispatch 三条触发
      # 路径在此汇合，后续步骤只认 $TAG，不存在多套分叉逻辑。
      # 优先级：dispatch 输入 > release 事件 tag > workflow_run 的 head_branch
      # （tag push 时即 tag 名）> GitHub 最新 Release。
      - name: Resolve tag and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ -n "${EVENT_TAG}" ]; then
            TAG="${EVENT_TAG}"
          elif [ -n "${WORKFLOW_RUN_BRANCH}" ]; then
            TAG="${WORKFLOW_RUN_BRANCH}"
          else
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::无法确定要同步的 tag（dispatch 输入 / release 事件 / workflow_run head_branch 均为空）。"
            exit 1
          fi

          release_json="${RUNNER_TEMP}/github_release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "${release_json}"

          # body 用文件传递：可能含换行/引号/任意字符，绝不拼进命令行。
          jq -r '.body // ""' "${release_json}" > "${BODY_FILE}"
          # 随机分隔符：即便 tag 或 release 名称含换行，也无法向 $GITHUB_ENV 注入变量。
          delimiter="__MUSICFLOW_GITEE_EOF_${RANDOM}${RANDOM}__"
          {
            echo "TAG<<${delimiter}"
            printf '%s\n' "${TAG}"
            echo "${delimiter}"
            echo "RELEASE_NAME<<${delimiter}"
            jq -r '.name // .tag_name' "${release_json}"
            echo "${delimiter}"
            echo "PRERELEASE=$(jq -r '.prerelease // false' "${release_json}")"
            echo "ASSET_COUNT=$(jq '.assets | length' "${release_json}")"
          } >> "${GITHUB_ENV}"

          echo "已解析：tag=${TAG}, assets=$(jq '.assets | length' "${release_json}")"

      - name: Validate secret
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::仓库 Secret GITEE_TOKEN 未配置，拒绝同步 ${TAG}。"
            exit 1
          fi
          echo "开始同步：tag=${TAG}, name=${RELEASE_NAME:-<空>}, prerelease=${PRERELEASE}"

      - name: Download all GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_DIR}"
          echo "GitHub Release ${TAG} 共有 ${ASSET_COUNT} 个附件。"
          if [ "${ASSET_COUNT}" -gt 0 ]; then
            gh release download "${TAG}" --dir "${ARTIFACT_DIR}" --clobber --repo "${GITHUB_REPOSITORY}"
          fi
          echo "待同步附件："
          find "${ARTIFACT_DIR}" -maxdepth 1 -type f -printf '  %f (%s bytes)\n' | sort

      - name: Push source and tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ray5378
          # 认证失败时禁止 git 交互式索要密码，否则 CI 会一直 hang。
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::本地缺少 tag ${TAG}，无法镜像到 Gitee。"
            exit 1
          fi

          # credential helper 的脚本体在 quoted heredoc 中保持字面量，token 只从环境变量读取。
          # 于是：.git/config 里只有脚本路径，git/curl 的 argv 与 CI 日志中都没有明文 token。
          helper="${RUNNER_TEMP}/gitee-credential-helper.sh"
          cat > "${helper}" <<'HELPER'
          #!/usr/bin/env bash
          printf 'username=%s\npassword=%s\n' "${GITEE_USERNAME}" "${GITEE_TOKEN}"
          HELPER
          chmod 700 "${helper}"
          git config --global "credential.https://gitee.com.helper" "!${helper}"

          git remote add gitee "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          # 分叉保护：若 Gitee main 已存在且不是 GitHub main 的祖先（历史分叉），
          # 立即报错并要求在 230（内网主机）重新做一次全量代推，绝不强推覆盖。
          # 背景：runner→Gitee 推增量没问题，但推完整历史（约 36MB pack）会被
          # Gitee 服务端拖到超时（实测 600s 仍失败），因此首次全量由 230 代推完成，
          # CI 之后的每次发版只推增量，几秒内完成。
          remote_main_sha="$(timeout 60 git ls-remote gitee "refs/heads/${GITEE_DEFAULT_BRANCH}" | awk '{print $1}')"
          if [ -n "${remote_main_sha}" ]; then
            if ! git merge-base --is-ancestor "${remote_main_sha}" refs/remotes/origin/main; then
              echo "::error::Gitee ${GITEE_DEFAULT_BRANCH} (${remote_main_sha}) 与 GitHub main 历史分叉，拒绝推送。"
              echo "::error::请在内网主机 230 上重新执行一次全量代推（push main + tags），不要强推覆盖。"
              rm -f "${helper}"
              exit 1
            fi
          fi

          # 只推 GitHub main 与本次 tag，不主动推 master；默认分支切换由 Python 助手
          # 通过 Gitee API 幂等完成。不用 --atomic（Gitee 不支持，会 hang）。
          # 分两条普通 push + timeout，任一条失败都能明确报错并退出，绝不无限等待。
          if ! timeout 600 git push gitee "refs/remotes/origin/main:refs/heads/${GITEE_DEFAULT_BRANCH}"; then
            echo "::error::Gitee main 分支推送失败或超时（tag=${TAG}）。"
            rm -f "${helper}"
            exit 1
          fi
          if ! timeout 600 git push gitee "refs/tags/${TAG}:refs/tags/${TAG}"; then
            echo "::error::Gitee tag ${TAG} 推送失败或超时。"
            rm -f "${helper}"
            exit 1
          fi

          rm -f "${helper}"
          echo "源码 + tag ${TAG} 已推送到 Gitee（main）。"

      - name: Set Gitee default branch, create or reuse Release, upload assets
        id: sync
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_BODY_FILE: ${{ github.workspace }}/.gitee_release_body.md
          GITEE_API_BASE: https://gitee.com/api/v5
        run: python3 .github/scripts/sync_gitee_release.py

      - name: Write job summary
        run: |
          {
            echo "## Gitee 同步完成"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Gitee Release: ${{ steps.sync.outputs.gitee_release_url }}"
            echo "- 源码(main，默认分支): https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/tree/main"
          } >> "${GITHUB_STEP_SUMMARY}"
